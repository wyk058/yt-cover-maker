<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新聞節目封面製作</title>
  
  <!-- Google Fonts: 思源黑體 Noto Sans TC (900 Black) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Fabric.js 畫布引擎 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <!-- Cropper.js 裁切套件 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Transformers.js (純前端 AI 去背模型 RMBG-1.4) -->
  <script type="module">
    import { AutoModel, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3';
    
    window.hfTransformers = { AutoModel, AutoProcessor, RawImage };
    window.isModelReady = false;
    
    async function initAI() {
      const status = document.getElementById('status-text');
      status.innerText = '系統準備中，請稍候...';
      try {
        await document.fonts.load('900 24px "Noto Sans TC"');
        window.model = await AutoModel.from_pretrained('briaai/RMBG-1.4', { config: { model_type: 'custom' } });
        window.processor = await AutoProcessor.from_pretrained('briaai/RMBG-1.4', { config: { do_normalize: true } });
        window.isModelReady = true;
        status.innerText = '系統已就緒，可點選底圖或直接按 Ctrl+V 貼上照片去背';
      } catch (err) {
        console.error('AI 載入錯誤:', err);
        status.innerText = 'AI 模型載入中，請保持網路連線。';
      }
    }
    initAI();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      display: flex;
      flex-direction: column;
    }
    
    header {
      height: 56px;
      min-height: 56px;
      background: #1c1c1e;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2c2c2e;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ff3b30;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span { color: #fff; }
    
    .history-controls {
      display: flex;
      gap: 6px;
    }
    .btn-history {
      padding: 6px 12px;
      background: #2c2c2e;
      border: 1px solid #48484a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-history:hover:not(:disabled) {
      background: #3a3a3c;
      border-color: #636366;
    }
    .btn-history:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .status {
      font-size: 0.9rem;
      color: #d1d1d6;
      background: #2c2c2e;
      padding: 6px 14px;
      border-radius: 20px;
      max-width: 450px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      min-width: 340px;
      background: #1c1c1e;
      border-right: 1px solid #2c2c2e;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .step-box {
      background: #252528;
      border: 1px solid #333336;
      border-radius: 8px;
      padding: 12px;
    }
    .section-title {
      font-size: 0.9rem;
      color: #ffffff;
      margin-bottom: 8px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button, .file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background: #333336;
      color: #fff;
      border: 1px solid #48484a;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.2s;
      text-align: center;
    }
    button:hover, .file-btn:hover {
      background: #3e3e42;
      border-color: #636366;
    }
    button.primary, .file-btn.primary {
      background: #ff3b30;
      border-color: #ff3b30;
    }
    button.primary:hover, .file-btn.primary:hover {
      background: #e03228;
    }
    button.success {
      background: #34c759;
      border-color: #34c759;
      color: #000;
      font-weight: 900;
    }
    button.success:hover {
      background: #2db34e;
    }
    button.secondary {
      background: #0a84ff;
      border-color: #0a84ff;
    }
    button.secondary:hover {
      background: #0070e0;
    }
    input[type="file"] { display: none; }

    .preset-bg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-bg-item {
      aspect-ratio: 16 / 9;
      border: 2px solid #48484a;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      background: #1c1c1e;
      transition: all 0.2s;
    }
    .preset-bg-item:hover {
      border-color: #ff3b30;
      transform: scale(1.02);
    }
    .preset-bg-item.active {
      border-color: #ff3b30;
      box-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
    }
    .preset-bg-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shadow-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .shadow-btn {
      padding: 7px 6px;
      font-size: 0.85rem;
      background: #2c2c2e;
      border: 1px solid #48484a;
      border-radius: 6px;
    }
    .shadow-btn:hover {
      background: #3a3a3c;
      border-color: #ff3b30;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .control-row input[type="color"] {
      border: 1px solid #48484a;
      width: 32px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
    .control-row input[type="range"] {
      flex: 1;
      margin-left: 12px;
    }
    .val-display {
      font-size: 0.85rem;
      color: #aaa;
      width: 28px;
      text-align: right;
    }

    .canvas-area {
      flex: 1;
      height: 100%;
      background: #09090b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    .canvas-wrapper {
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      line-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .tips {
      font-size: 0.8rem;
      color: #8e8e93;
      line-height: 1.5;
      margin-top: auto;
      padding-top: 8px;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }
    .crop-container {
      max-height: 480px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .crop-container img {
      max-width: 100%;
      max-height: 450px;
      display: block;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .custom-context-menu {
      display: none;
      position: fixed;
      z-index: 99999;
      background: #252528;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      padding: 6px 0;
      min-width: 200px;
    }
    .context-menu-item {
      padding: 9px 16px;
      font-size: 0.88rem;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .context-menu-item:hover {
      background: #3a3a3c;
      color: #fff;
    }
    .context-menu-item.danger:hover {
      background: #5a1e1e;
      color: #ff6b6b;
    }
    .context-menu-divider {
      height: 1px;
      background: #3a3a3c;
      margin: 4px 0;
    }
    .shortcut-hint {
      font-size: 0.76rem;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>新聞節目封面製作</span>
      </div>
      <div class="history-controls">
        <button id="btn-undo" class="btn-history" title="快捷鍵: Ctrl+Z (Mac: Cmd+Z)" disabled>↩️ 復原 (Ctrl+Z)</button>
        <button id="btn-redo" class="btn-history" title="快捷鍵: Ctrl+Y (Mac: Cmd+Shift+Z)" disabled>↪️ 重做 (Ctrl+Y)</button>
      </div>
    </div>
    <div class="header-right">
      <div class="status" id="status-text">系統初始化中...</div>
      <button class="success" id="btn-download">💾 下載封面圖 (JPG)</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      
      <!-- 第一步：背景底圖 -->
      <div class="step-box">
        <div class="section-title">第一步：選擇背景底圖</div>
        <div class="preset-bg-grid" id="preset-bg-list"></div>
        <label class="file-btn" style="width: 100%;">
          📁 從電腦自選上傳底圖
          <input type="file" id="upload-bg" accept="image/*">
        </label>
      </div>

      <!-- 第二步：照片 -->
      <div class="step-box">
        <div class="section-title">第二步：加入主播照片（自動去背）</div>
        <div class="btn-group">
          <label class="file-btn primary">
            ✨ 上傳照片（或按 Ctrl+V 貼上）
            <input type="file" id="upload-portrait" accept="image/*">
          </label>
          <button id="btn-crop-active" class="secondary">✂️ 裁切選取的照片</button>
        </div>
      </div>

      <!-- 第三步：文字標題與顏色外框 -->
      <div class="step-box">
        <div class="section-title">第三步：加入新聞標題與外框</div>
        <div class="btn-group" style="margin-bottom: 10px;">
          <button id="btn-add-text">➕ 新增新聞大標題</button>
        </div>
        <div class="control-row">
          <span>文字顏色</span>
          <input type="color" id="text-color" value="#FFE600">
        </div>
        <div class="control-row">
          <span>外框顏色</span>
          <input type="color" id="stroke-color" value="#000000">
        </div>
        <div class="control-row">
          <span>外框粗細</span>
          <input type="range" id="stroke-width" min="0" max="40" value="16">
          <span class="val-display" id="stroke-width-val">16</span>
        </div>
      </div>

      <!-- 第四步：陰影效果 -->
      <div class="step-box">
        <div class="section-title">第四步：立體陰影效果</div>
        <div class="shadow-grid">
          <button class="shadow-btn" onclick="applyShadowPreset('hard')">立體黑邊</button>
          <button class="shadow-btn" onclick="applyShadowPreset('soft')">柔和陰影</button>
          <button class="shadow-btn" onclick="applyShadowPreset('floating')">人物浮空</button>
          <button class="shadow-btn" onclick="applyShadowPreset('glow')">金色光暈</button>
          <button class="shadow-btn" onclick="applyShadowPreset('none')" style="grid-column: span 2; background:#382222;">清除陰影</button>
        </div>
      </div>

      <!-- 第五步：圖層順序與刪除 -->
      <div class="step-box">
        <div class="section-title">第五步：圖層順序調整</div>
        <div class="btn-group">
          <button id="btn-bring-front">移至最上層</button>
          <button id="btn-send-back">移至最下層</button>
          <button id="btn-delete" style="background:#5a1e1e; border-color:#802828;">刪除選取物件</button>
        </div>
      </div>

      <div class="tips">
       
      </div>
    </div>

    <div class="canvas-area" id="canvasContainer">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="ytCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- 裁切彈窗 Modal -->
  <div class="modal-backdrop" id="cropModal">
    <div class="modal-box">
      <div class="modal-header">裁切照片範圍</div>
      <div class="crop-container">
        <img id="cropImage" src="" alt="待裁切圖片">
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-crop">取消</button>
        <button class="primary" id="btn-apply-crop">確定套用裁切</button>
      </div>
    </div>
  </div>

  <!-- 自訂右鍵選單 -->
  <div class="custom-context-menu" id="customContextMenu">
    <div class="context-menu-item" id="ctx-paste-photo">
      <span>🖼️ 貼上照片並自動去背</span>
      <span class="shortcut-hint">Ctrl+V</span>
    </div>
    <div class="context-menu-item" id="ctx-paste-text">
      <span>📝 貼上文字作為標題</span>
      <span class="shortcut-hint">Ctrl+V</span>
    </div>
    <div class="context-menu-divider" id="ctx-divider-1"></div>
    <div class="context-menu-item" id="ctx-copy">
      <span>📄 複製選取物件</span>
      <span class="shortcut-hint">Ctrl+C</span>
    </div>
    <div class="context-menu-item" id="ctx-paste-obj">
      <span>📑 貼上物件</span>
      <span class="shortcut-hint">Ctrl+V</span>
    </div>
    <div class="context-menu-divider" id="ctx-divider-2"></div>
    <div class="context-menu-item" id="ctx-bring-front">
      <span>⬆️ 移至最上層</span>
    </div>
    <div class="context-menu-item" id="ctx-send-back">
      <span>⬇️ 移至最下層</span>
    </div>
    <div class="context-menu-item danger" id="ctx-delete">
      <span>🗑️ 刪除選取物件</span>
      <span class="shortcut-hint">Delete</span>
    </div>
  </div>

  <script>
    fabric.Object.prototype.set({
      borderColor: '#ff3b30',
      cornerColor: '#ff3b30',
      cornerStrokeColor: '#ffffff',
      cornerStyle: 'circle',
      cornerSize: 18,
      borderScaleFactor: 3,
      transparentCorners: false,
      padding: 8
    });

    const TEXT_DEFAULTS = {
      text: '輸入新聞大標題',
      fill: '#FFE600',
      stroke: '#000000',
      strokeWidth: 16,
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      fontSize: 140
    };

    const SHADOW_PRESETS = {
      hard: { color: 'rgba(0, 0, 0, 0.75)', blur: 3, offsetX: 6, offsetY: 6 },
      soft: { color: 'rgba(0, 0, 0, 0.55)', blur: 20, offsetX: 8, offsetY: 8 },
      floating: { color: 'rgba(0, 0, 0, 0.3)', blur: 30, offsetX: 3, offsetY: 15 },
      glow: { color: 'rgba(255, 230, 0, 0.75)', blur: 35, offsetX: 0, offsetY: 0 }
    };

    // 💡【可在此自訂 GitHub 相對路徑圖片】
    const presetBackgrounds = [
      { name: '底圖 1', url: './backgrounds/bg1.jpg' },
      { name: '底圖 2', url: './backgrounds/bg2.jpg' },
      { name: '底圖 3', url: './backgrounds/bg3.jpg' },
      { name: '底圖 4', url: './backgrounds/bg4.jpg' }
    ];

    const ORIGINAL_WIDTH = 1920;
    const ORIGINAL_HEIGHT = 1080;
    let currentScale = 1;

    const canvas = new fabric.Canvas('ytCanvas', {
      backgroundColor: '#111111',
      preserveObjectStacking: true,
      fireRightClick: true
    });

    const statusText = document.getElementById('status-text');
    const container = document.getElementById('canvasContainer');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const contextMenu = document.getElementById('customContextMenu');
    let cropper = null;
    let targetFabricImg = null;
    let copiedObject = null;
    let lastRightClickPos = { x: 800, y: 400 };

    const historyStack = [];
    const redoStack = [];
    let isHistoryLocked = false;
    const MAX_HISTORY = 25;

    function saveState() {
      if (isHistoryLocked) return;
      const json = JSON.stringify(canvas.toJSON(['customData']));
      historyStack.push(json);
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      }
      redoStack.length = 0;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      btnUndo.disabled = historyStack.length <= 1;
      btnRedo.disabled = redoStack.length === 0;
    }

    function undo() {
      if (historyStack.length <= 1) return;
      isHistoryLocked = true;
      const currentState = historyStack.pop();
      redoStack.push(currentState);
      const prevState = historyStack[historyStack.length - 1];

      canvas.loadFromJSON(prevState, () => {
        canvas.setViewportTransform([currentScale, 0, 0, currentScale, 0, 0]);
        canvas.renderAll();
        isHistoryLocked = false;
        updateHistoryButtons();
        statusText.innerText = '↩️ 已復原上一步';
      });
    }

    function redo() {
      if (redoStack.length === 0) return;
      isHistoryLocked = true;
      const nextState = redoStack.pop();
      historyStack.push(nextState);

      canvas.loadFromJSON(nextState, () => {
        canvas.setViewportTransform([currentScale, 0, 0, currentScale, 0, 0]);
        canvas.renderAll();
        isHistoryLocked = false;
        updateHistoryButtons();
        statusText.innerText = '↪️ 已重做下一步';
      });
    }

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    canvas.on('object:added', (e) => { if (!isHistoryLocked) saveState(); });
    canvas.on('object:modified', (e) => { if (!isHistoryLocked) saveState(); });
    canvas.on('object:removed', (e) => { if (!isHistoryLocked) saveState(); });

    window.addEventListener('keydown', (e) => {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.isEditing) return;

      const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
      const ctrlKey = isMac ? e.metaKey : e.ctrlKey;

      if (ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      } else if (
        (ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z') ||
        (ctrlKey && e.key.toLowerCase() === 'y')
      ) {
        e.preventDefault();
        redo();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (activeObj) {
          canvas.remove(activeObj);
          canvas.renderAll();
          saveState();
        }
      } else if (ctrlKey && e.key.toLowerCase() === 'c') {
        if (activeObj) {
          activeObj.clone((cloned) => { copiedObject = cloned; });
        }
      }
    });

    function addHeadlineText(customString, posX, posY) {
      const textToUse = customString || TEXT_DEFAULTS.text;
      const textObj = new fabric.IText(textToUse, {
        left: posX !== undefined ? posX : 750,
        top: posY !== undefined ? posY : 380,
        fontFamily: '"Noto Sans TC", sans-serif',
        fontWeight: '900',
        fontSize: TEXT_DEFAULTS.fontSize,
        fill: TEXT_DEFAULTS.fill,
        stroke: TEXT_DEFAULTS.stroke,
        strokeWidth: TEXT_DEFAULTS.strokeWidth,
        strokeLineJoin: TEXT_DEFAULTS.strokeLineJoin,
        strokeLineCap: TEXT_DEFAULTS.strokeLineCap,
        paintFirst: 'stroke',
        shadow: new fabric.Shadow(SHADOW_PRESETS.hard)
      });
      canvas.add(textObj);
      canvas.setActiveObject(textObj);

      document.getElementById('text-color').value = TEXT_DEFAULTS.fill;
      document.getElementById('stroke-color').value = TEXT_DEFAULTS.stroke;
      document.getElementById('stroke-width').value = TEXT_DEFAULTS.strokeWidth;
      document.getElementById('stroke-width-val').innerText = TEXT_DEFAULTS.strokeWidth;

      statusText.innerText = '已新增標題，連點兩下可修改文字！';
      saveState();
    }

    document.getElementById('btn-add-text').addEventListener('click', () => {
      addHeadlineText();
    });

    async function processAndAddPortrait(fileOrBlob, posX, posY) {
      if (!fileOrBlob) return;

      if (!window.isModelReady) {
        alert('去背系統準備中，請稍候幾秒再試！');
        return;
      }

      statusText.innerText = '⏳ AI 正在去背運算中，請稍候...';

      try {
        const { RawImage } = window.hfTransformers;
        const imgUrl = URL.createObjectURL(fileOrBlob);
        const image = await RawImage.fromURL(imgUrl);

        const { pixel_values } = await window.processor(image);
        const { output } = await window.model({ input: pixel_values });

        const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(image.width, image.height);
        
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = image.width;
        offscreenCanvas.height = image.height;
        const ctx = offscreenCanvas.getContext('2d');

        const originalCanvas = image.toCanvas();
        ctx.drawImage(originalCanvas, 0, 0);

        const imgData = ctx.getImageData(0, 0, image.width, image.height);
        for (let i = 0; i < mask.data.length; ++i) {
          imgData.data[4 * i + 3] = mask.data[i];
        }
        ctx.putImageData(imgData, 0, 0);

        const resultUrl = offscreenCanvas.toDataURL('image/png');
        fabric.Image.fromURL(resultUrl, function(fabricImg) {
          fabricImg.scaleToHeight(900);
          fabricImg.set({
            left: posX !== undefined ? posX : 150,
            top: posY !== undefined ? posY : 100,
            shadow: new fabric.Shadow(SHADOW_PRESETS.soft)
          });
          fabricImg.customData = { originalSrc: resultUrl };
          canvas.add(fabricImg);
          canvas.setActiveObject(fabricImg);
          statusText.innerText = '🎉 照片去背完成！可直接拖曳移動或裁切。';
          saveState();
        });

      } catch (err) {
        console.error('去背錯誤:', err);
        statusText.innerText = '去背失敗，請確認圖片是否清晰。';
      }
    }

    document.getElementById('upload-portrait').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        processAndAddPortrait(file);
        e.target.value = '';
      }
    });

    window.addEventListener('paste', function(e) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.isEditing) return;

      const clipboardItems = e.clipboardData?.items;
      if (!clipboardItems) return;

      for (let i = 0; i < clipboardItems.length; i++) {
        const item = clipboardItems[i];
        if (item.type.indexOf('image') !== -1) {
          e.preventDefault();
          const blob = item.getAsFile();
          statusText.innerText = '📋 已偵測到剪貼簿照片，正在自動去背...';
          processAndAddPortrait(blob);
          return;
        }
      }

      const pastedText = e.clipboardData.getData('text');
      if (pastedText && pastedText.trim() !== '') {
        e.preventDefault();
        statusText.innerText = '📝 已將複製的文字直接貼上為標題！';
        addHeadlineText(pastedText.trim());
        return;
      }

      if (copiedObject) {
        pasteCanvasObject();
      }
    });

    function pasteCanvasObject(posX, posY) {
      if (!copiedObject) return;
      copiedObject.clone((clonedObj) => {
        canvas.discardActiveObject();
        clonedObj.set({
          left: posX !== undefined ? posX : clonedObj.left + 30,
          top: posY !== undefined ? posY : clonedObj.top + 30,
          evented: true
        });
        if (clonedObj.type === 'activeSelection') {
          clonedObj.canvas = canvas;
          clonedObj.forEachObject((obj) => canvas.add(obj));
          clonedObj.setCoords();
        } else {
          canvas.add(clonedObj);
        }
        copiedObject.top += 30;
        copiedObject.left += 30;
        canvas.setActiveObject(clonedObj);
        canvas.requestRenderAll();
        saveState();
      });
    }

    window.addEventListener('contextmenu', function(e) {
      const containerRect = container.getBoundingClientRect();
      if (
        e.clientX >= containerRect.left &&
        e.clientX <= containerRect.right &&
        e.clientY >= containerRect.top &&
        e.clientY <= containerRect.bottom
      ) {
        e.preventDefault();
        
        const canvasWrapperRect = document.getElementById('canvasWrapper').getBoundingClientRect();
        lastRightClickPos = {
          x: (e.clientX - canvasWrapperRect.left) / currentScale,
          y: (e.clientY - canvasWrapperRect.top) / currentScale
        };

        const clickedObj = canvas.findTarget(e, false);
        if (clickedObj) {
          canvas.setActiveObject(clickedObj);
          canvas.renderAll();
        }
        
        const activeObj = canvas.getActiveObject();
        const hasActive = !!activeObj;

        document.getElementById('ctx-copy').style.display = hasActive ? 'flex' : 'none';
        document.getElementById('ctx-bring-front').style.display = hasActive ? 'flex' : 'none';
        document.getElementById('ctx-send-back').style.display = hasActive ? 'flex' : 'none';
        document.getElementById('ctx-delete').style.display = hasActive ? 'flex' : 'none';
        document.getElementById('ctx-divider-2').style.display = hasActive ? 'block' : 'none';
        document.getElementById('ctx-paste-obj').style.display = copiedObject ? 'flex' : 'none';

        let posX = e.clientX;
        let posY = e.clientY;
        if (posX + 210 > window.innerWidth) posX = window.innerWidth - 220;
        if (posY + 320 > window.innerHeight) posY = window.innerHeight - 330;

        contextMenu.style.left = posX + 'px';
        contextMenu.style.top = posY + 'px';
        contextMenu.style.display = 'block';
      } else {
        contextMenu.style.display = 'none';
      }
    });

    window.addEventListener('click', function(e) {
      if (!contextMenu.contains(e.target)) {
        contextMenu.style.display = 'none';
      }
    });

    document.getElementById('ctx-paste-photo').addEventListener('click', async function() {
      contextMenu.style.display = 'none';
      try {
        if (navigator.clipboard && navigator.clipboard.read) {
          const clipboardItems = await navigator.clipboard.read();
          for (const item of clipboardItems) {
            const imageType = item.types.find(t => t.startsWith('image/'));
            if (imageType) {
              const blob = await item.getType(imageType);
              statusText.innerText = '📋 正在從剪貼簿貼上照片並去背...';
              processAndAddPortrait(blob, lastRightClickPos.x - 200, lastRightClickPos.y - 300);
              return;
            }
          }
          alert('剪貼簿中沒有照片！請先複製照片。');
        } else {
          alert('請直接在畫布上按鍵盤「Ctrl + V」貼上照片！');
        }
      } catch (err) {
        alert('請直接按鍵盤快捷鍵「Ctrl + V」即可貼上去背！');
      }
    });

    document.getElementById('ctx-paste-text').addEventListener('click', async function() {
      contextMenu.style.display = 'none';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text && text.trim() !== '') {
            addHeadlineText(text.trim(), lastRightClickPos.x - 200, lastRightClickPos.y - 50);
            statusText.innerText = '📝 已貼上文字為標題！';
            return;
          }
        }
        alert('剪貼簿中沒有文字！請先複製文字。');
      } catch (err) {
        alert('請直接在畫布上按鍵盤快捷鍵「Ctrl + V」即可貼上文字！');
      }
    });

    document.getElementById('ctx-copy').addEventListener('click', function() {
      contextMenu.style.display = 'none';
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        activeObj.clone((cloned) => {
          copiedObject = cloned;
          statusText.innerText = '已複製選取物件，可點右鍵「貼上物件」';
        });
      }
    });

    document.getElementById('ctx-paste-obj').addEventListener('click', function() {
      contextMenu.style.display = 'none';
      pasteCanvasObject(lastRightClickPos.x, lastRightClickPos.y);
    });

    document.getElementById('ctx-bring-front').addEventListener('click', function() {
      contextMenu.style.display = 'none';
      const activeObj = canvas.getActiveObject();
      if (activeObj) { activeObj.bringToFront(); canvas.renderAll(); saveState(); }
    });

    document.getElementById('ctx-send-back').addEventListener('click', function() {
      contextMenu.style.display = 'none';
      const activeObj = canvas.getActiveObject();
      if (activeObj) { activeObj.sendToBack(); canvas.renderAll(); saveState(); }
    });

    document.getElementById('ctx-delete').addEventListener('click', function() {
      contextMenu.style.display = 'none';
      const activeObj = canvas.getActiveObject();
      if (activeObj) { canvas.remove(activeObj); canvas.renderAll(); saveState(); }
    });

    function resizeCanvas() {
      const padding = 32;
      const availableWidth = container.clientWidth - padding;
      const availableHeight = container.clientHeight - padding;

      if (availableWidth <= 0 || availableHeight <= 0) return;

      const scaleX = availableWidth / ORIGINAL_WIDTH;
      const scaleY = availableHeight / ORIGINAL_HEIGHT;
      currentScale = Math.min(scaleX, scaleY);

      const displayWidth = Math.round(ORIGINAL_WIDTH * currentScale);
      const displayHeight = Math.round(ORIGINAL_HEIGHT * currentScale);

      canvas.setDimensions({ width: displayWidth, height: displayHeight });
      canvas.setViewportTransform([currentScale, 0, 0, currentScale, 0, 0]);
      canvas.renderAll();
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    window.applyShadowPreset = function(presetKey) {
      const activeObj = canvas.getActiveObject();
      if (!activeObj) {
        alert('請先點選畫布上的文字或照片，再選擇陰影效果！');
        return;
      }

      if (presetKey === 'none') {
        activeObj.set('shadow', null);
        statusText.innerText = '已清除陰影效果';
      } else {
        const conf = SHADOW_PRESETS[presetKey];
        activeObj.set('shadow', new fabric.Shadow({
          color: conf.color,
          blur: conf.blur,
          offsetX: conf.offsetX,
          offsetY: conf.offsetY
        }));
        statusText.innerText = '已成功套用立體陰影';
      }
      canvas.renderAll();
      saveState();
    };

    // 💡【底圖等比例滿版填滿核心】
    function applyBackgroundFromUrl(url, successMsg) {
      statusText.innerText = '正在載入底圖...';

      fabric.Image.fromURL(url, function(fabricImg) {
        if (!fabricImg) {
          statusText.innerText = '底圖載入失敗，請確認圖片路徑。';
          return;
        }

        const scale = Math.max(ORIGINAL_WIDTH / fabricImg.width, ORIGINAL_HEIGHT / fabricImg.height);
        
        fabricImg.set({
          scaleX: scale,
          scaleY: scale,
          originX: 'center',
          originY: 'center',
          left: ORIGINAL_WIDTH / 2,
          top: ORIGINAL_HEIGHT / 2
        });

        canvas.setBackgroundImage(fabricImg, function() {
          canvas.renderAll();
          statusText.innerText = successMsg || '底圖已成功等比例縮放至 1920x1080 滿版！';
          saveState();
        });
      });
    }

    // 渲染預設底圖縮圖
    const presetContainer = document.getElementById('preset-bg-list');
    presetBackgrounds.forEach((bg, index) => {
      const item = document.createElement('div');
      item.className = 'preset-bg-item' + (index === 0 ? ' active' : '');
      item.title = bg.name;
      item.innerHTML = `<img src="${bg.url}" alt="${bg.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'160\\' height=\\'90\\' fill=\\'%23333\\'><rect width=\\'100%\\' height=\\'100%\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23888\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'12\\'>${bg.name}</text></svg>'">`;
      item.addEventListener('click', () => {
        document.querySelectorAll('.preset-bg-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        applyBackgroundFromUrl(bg.url);
      });
      presetContainer.appendChild(item);
    });

    if (presetBackgrounds.length > 0) {
      applyBackgroundFromUrl(presetBackgrounds[0].url);
    }

    document.getElementById('upload-bg').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(f) {
        document.querySelectorAll('.preset-bg-item').forEach(el => el.classList.remove('active'));
        applyBackgroundFromUrl(f.target.result, '自選底圖已等比例縮放至 1920x1080 滿版！');
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    const cropModal = document.getElementById('cropModal');
    const cropImage = document.getElementById('cropImage');

    document.getElementById('btn-crop-active').addEventListener('click', () => {
      const activeObj = canvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') {
        return alert('請先在畫布上點選要裁切的照片！');
      }

      targetFabricImg = activeObj;
      const imgSrc = activeObj.customData?.originalSrc || activeObj.getSrc();
      cropImage.src = imgSrc;
      cropModal.style.display = 'flex';

      if (cropper) cropper.destroy();
      cropper = new Cropper(cropImage, {
        viewMode: 1,
        autoCropArea: 0.9,
        responsive: true,
        background: false
      });
    });

    document.getElementById('btn-cancel-crop').addEventListener('click', () => {
      cropModal.style.display = 'none';
      if (cropper) cropper.destroy();
    });

    document.getElementById('btn-apply-crop').addEventListener('click', () => {
      if (!cropper || !targetFabricImg) return;
      const croppedCanvas = cropper.getCroppedCanvas();
      const croppedUrl = croppedCanvas.toDataURL('image/png');

      targetFabricImg.setSrc(croppedUrl, function() {
        if (!targetFabricImg.customData) targetFabricImg.customData = {};
        targetFabricImg.customData.originalSrc = croppedUrl;
        targetFabricImg.setCoords();
        canvas.renderAll();
        cropModal.style.display = 'none';
        if (cropper) cropper.destroy();
        statusText.innerText = '照片裁切完成！';
        saveState();
      });
    });

    canvas.on('selection:created', updateControls);
    canvas.on('selection:updated', updateControls);

    function updateControls() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        if (obj.fill) document.getElementById('text-color').value = obj.fill;
        if (obj.stroke) document.getElementById('stroke-color').value = obj.stroke;
        const width = obj.strokeWidth !== undefined ? obj.strokeWidth : 0;
        document.getElementById('stroke-width').value = width;
        document.getElementById('stroke-width-val').innerText = width;
      }
    }

    document.getElementById('text-color').addEventListener('input', function(e) {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set('fill', e.target.value);
        canvas.renderAll();
      }
    });
    document.getElementById('text-color').addEventListener('change', saveState);

    document.getElementById('stroke-color').addEventListener('input', function(e) {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set('stroke', e.target.value);
        canvas.renderAll();
      }
    });
    document.getElementById('stroke-color').addEventListener('change', saveState);

    document.getElementById('stroke-width').addEventListener('input', function(e) {
      const val = parseInt(e.target.value, 10);
      document.getElementById('stroke-width-val').innerText = val;
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set({
          strokeWidth: val,
          strokeLineJoin: 'round',
          strokeLineCap: 'round'
        });
        canvas.renderAll();
      }
    });
    document.getElementById('stroke-width').addEventListener('change', saveState);

    document.getElementById('btn-bring-front').addEventListener('click', () => {
      const obj = canvas.getActiveObject();
      if (obj) { obj.bringToFront(); canvas.renderAll(); saveState(); }
    });

    document.getElementById('btn-send-back').addEventListener('click', () => {
      const obj = canvas.getActiveObject();
      if (obj) { obj.sendToBack(); canvas.renderAll(); saveState(); }
    });

    document.getElementById('btn-delete').addEventListener('click', () => {
      const obj = canvas.getActiveObject();
      if (obj) { canvas.remove(obj); canvas.renderAll(); saveState(); }
    });

    document.getElementById('btn-download').addEventListener('click', function() {
      statusText.innerText = '⏳ 正在產生 1920x1080 封面圖...';

      try {
        let quality = 0.92;
        let dataURL = canvas.toDataURL({
          format: 'jpeg',
          quality: quality,
          multiplier: 1 / currentScale
        });

        let head = 'data:image/jpeg;base64,';
        let fileSizeInBytes = Math.round((dataURL.length - head.length) * 3 / 4);

        while (fileSizeInBytes > 2000000 && quality > 0.4) {
          quality -= 0.08;
          dataURL = canvas.toDataURL({
            format: 'jpeg',
            quality: quality,
            multiplier: 1 / currentScale
          });
          fileSizeInBytes = Math.round((dataURL.length - head.length) * 3 / 4);
        }

        const sizeInMB = (fileSizeInBytes / (1024 * 1024)).toFixed(2);
        const link = document.createElement('a');
        link.download = '新聞封面圖.jpg';
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        statusText.innerText = `💾 封面圖下載成功！(${sizeInMB} MB)`;
      } catch (err) {
        console.error('下載失敗:', err);
        statusText.innerText = '❌ 下載失敗，請確認圖片載入是否正常。';
      }
    });
  </script>
</body>
</html>
